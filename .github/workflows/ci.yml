name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: cashcount
          POSTGRES_USER: cashcount
          POSTGRES_PASSWORD: cashcount-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashcount -d cashcount"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LOCAL_DATABASE_URL: postgresql://cashcount:cashcount-local@127.0.0.1:5432/cashcount

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration metadata
        run: pnpm db:check

      - name: Run quality gates
        run: pnpm check

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
